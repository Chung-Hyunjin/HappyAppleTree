<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8ef">
  <title>오늘의 행복 사과나무</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--ink:#29443a;--muted:#75877b;--green:#577b52;--leaf:#91ad78;--cream:#fffdf5;--pink:#f5bdc1;--red:#e66a5e;--gold:#e7bc65;--shadow:0 12px 32px #526f4d18}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 17%,#fffdf7 0,#f6f8ef 48%,#eaf1e4 100%);color:var(--ink);font-family:'Gowun Dodum',sans-serif}button,input{font:inherit}button{cursor:pointer}
    .page{max-width:1180px;margin:auto;padding:28px 28px 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:11px;font:22px 'Jua',sans-serif}.brand-icon{font-size:30px}.top-actions{display:flex;gap:9px}.soft-button,.draw-button,.upload-button{border:0;border-radius:999px;padding:11px 17px;font-weight:bold;transition:.2s}.soft-button{background:#fff;color:var(--green);box-shadow:0 4px 14px #405d4112}.soft-button:hover,.upload-button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.intro{text-align:center;padding:35px 0 23px}.eyebrow{display:inline-flex;align-items:center;gap:6px;color:#718c68;background:#e9f0e2;border-radius:99px;padding:7px 13px;font-size:13px}.intro h1{font:clamp(30px,5vw,47px) 'Jua',sans-serif;letter-spacing:-.8px;margin:13px 0 7px}.intro p{margin:0;color:var(--muted);font-size:16px}.dashboard{display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;margin:23px 0 16px}.stat{background:#ffffffb8;border:1px solid #e8edde;border-radius:14px;padding:9px 15px;color:#728477;font-size:14px}.stat strong{font:20px 'Jua',sans-serif;color:var(--green);margin-right:4px}.draw-button{padding:14px 27px;background:#e86e5e;color:white;font:18px 'Jua',sans-serif;box-shadow:0 7px 16px #db75604a}.draw-button:hover{transform:translateY(-2px);background:#dc5d50}.draw-button:disabled{opacity:.5;cursor:not-allowed;transform:none}.tree-stage{position:relative;min-height:505px;overflow:hidden;border:1px solid #e8ecdf;border-radius:30px;background:linear-gradient(180deg,#f9fbf4 0%,#f2f7eb 70%,#e7efdf 100%);box-shadow:var(--shadow)}.sun{position:absolute;top:31px;right:10%;width:73px;height:73px;border-radius:50%;background:#ffe5a7;box-shadow:0 0 0 13px #ffe5a733}.cloud{position:absolute;color:#fff;font-size:43px;opacity:.8}.cloud.one{top:65px;left:8%}.cloud.two{top:125px;right:9%;font-size:35px}.ground{position:absolute;bottom:0;left:0;right:0;height:65px;background:linear-gradient(#dce9d2,#d4e4c9);border-radius:50% 50% 0 0 / 30% 30% 0 0}.tree{position:absolute;width:min(470px,67vw);height:380px;left:50%;bottom:22px;transform:translateX(-50%)}.trunk{position:absolute;left:50%;bottom:0;width:90px;height:187px;transform:translateX(-50%);background:linear-gradient(90deg,#805c3c,#a77b51 48%,#805c3c);border-radius:44% 44% 9px 9px;clip-path:polygon(24% 100%,30% 37%,4% 12%,12% 5%,39% 25%,46% 0,58% 0,62% 25%,90% 5%,98% 13%,67% 43%,78% 100%)}.foliage{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#abc68c,#759b69 72%);box-shadow:inset -12px -13px 0 #668d602c}.crown-a{width:218px;height:210px;left:50%;top:20px;transform:translateX(-50%)}.crown-b{width:177px;height:174px;left:52px;top:99px}.crown-c{width:177px;height:174px;right:52px;top:99px}.crown-d{width:170px;height:160px;left:50%;top:157px;transform:translateX(-50%)}.branches{position:absolute;left:50%;top:142px;width:240px;height:145px;transform:translateX(-50%);border-top:8px solid #815d3d;border-radius:50%;opacity:.9}.branches:before,.branches:after{content:'';position:absolute;top:-26px;width:7px;height:69px;background:#815d3d;transform:rotate(-42deg);left:42px;border-radius:8px}.branches:after{left:auto;right:41px;transform:rotate(42deg)}.flowers-layer{position:absolute;inset:0;z-index:3}.flower{position:absolute;width:58px;height:67px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:transparent;transform:translate(-50%,-50%);transition:transform .2s,filter .2s;filter:drop-shadow(0 3px 2px #3d60362b)}.flower:hover{transform:translate(-50%,-50%) scale(1.14);z-index:5}.flower .emoji{font-size:36px;line-height:39px}.flower.apple .emoji{font-size:34px}.flower .name{max-width:75px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 5px;border-radius:9px;background:#fff9;color:#fff;font-size:11px;text-shadow:0 1px 3px #29443a}.empty-hint{position:absolute;z-index:4;left:50%;top:52%;transform:translate(-50%,-50%);width:min(310px,80%);padding:17px 18px;border:1px dashed #c9d8bd;border-radius:18px;background:#ffffffd9;text-align:center;color:#6b816c;line-height:1.6}.empty-hint strong{display:block;color:#567550;font:18px 'Jua',sans-serif;margin-bottom:4px}.tree-footer{position:relative;z-index:4;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px}.upload-button{background:#fff;color:#55734e;box-shadow:0 4px 14px #405d4112}.note{text-align:center;color:#8b9b8c;font-size:12px;margin:12px 0 0}.file-input{display:none}.modal-backdrop{position:fixed;inset:0;background:#23372f75;display:none;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(4px)}.modal-backdrop.open{display:flex}.modal{width:min(440px,100%);padding:27px;border-radius:25px;background:var(--cream);box-shadow:0 25px 80px #172a2066;animation:pop .25s ease}.modal h2{font:25px 'Jua',sans-serif;margin:0 0 7px}.modal .sub{color:var(--muted);margin:0 0 18px}.modal input{width:100%;padding:12px 14px;border:1px solid #dfe7d9;border-radius:12px;outline:none;color:var(--ink);background:white}.modal input:focus{border-color:#91ad78;box-shadow:0 0 0 3px #91ad7828}.modal label{display:block;font-size:13px;color:#6e8171;margin:13px 0 7px}.modal-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal-buttons button{border:0;border-radius:11px;padding:10px 16px}.cancel{background:#edf1e9;color:#667663}.save{background:#66895d;color:white;font-weight:bold}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:11px 18px;border-radius:99px;background:#29443a;color:white;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.result-backdrop{position:fixed;inset:0;background:#142a23c9;display:none;align-items:center;justify-content:center;z-index:25;padding:20px}.result-backdrop.open{display:flex}.result-card{width:min(500px,100%);min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 28px;border-radius:32px;background:radial-gradient(circle at top,#fffbe9,#fff 60%);box-shadow:0 30px 100px #101e1a88;animation:pop .35s ease}.result-apple{font-size:80px;animation:bob 1.5s ease-in-out infinite}.result-card h2{font:32px 'Jua',sans-serif;margin:7px 0}.result-card .message{font-size:22px;line-height:1.55;color:#5d7659;margin:6px 0 23px;max-width:390px;overflow-wrap:anywhere}.result-card .close-result{border:0;border-radius:99px;padding:11px 22px;background:#6c8c62;color:white;font-weight:bold}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translate(-50%,180px) rotate(35deg);opacity:0}}
    @media(max-width:600px){.page{padding:18px 14px 27px}.brand{font-size:18px}.top-actions .soft-button{padding:9px 11px;font-size:12px}.intro{padding-top:29px}.intro p{font-size:14px}.tree-stage{min-height:440px;border-radius:23px}.tree{width:min(420px,95vw);height:355px;bottom:20px}.crown-b{left:16px}.crown-c{right:16px}.crown-a{top:25px;width:195px;height:190px}.crown-b,.crown-c{width:157px;height:155px;top:105px}.crown-d{width:155px;height:150px;top:160px}.trunk{height:170px}.flower{width:51px;height:60px}.flower .emoji{font-size:32px}.flower.apple .emoji{font-size:30px}.sun{width:55px;height:55px;top:24px}.cloud.one{font-size:34px}.cloud.two{font-size:28px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div class="brand"><span class="brand-icon">🌳</span> 오늘의 행복 사과나무</div><div class="top-actions"><button class="soft-button" id="resetButton" type="button">↻ 오늘의 나무 초기화</button></div></header>
    <section class="intro"><span class="eyebrow">🌼 작은 말 한마디가 피우는 행복</span><h1>오늘의 행복을 키워요</h1><p>사과꽃을 행복한 말로 채우고, 오늘의 사과를 뽑아보세요.</p></section>
    <section class="dashboard" aria-label="나무 현황"><div class="stat">🌸 아직 꽃 <strong id="flowerCount">0</strong></div><div class="stat">🍎 열린 사과 <strong id="appleCount">0</strong></div><div class="stat">✨ 오늘 뽑은 사과 <strong id="pickedCount">0</strong></div><button class="draw-button" id="drawButton" type="button" disabled>🍎 사과 뽑기</button></section>
    <section class="tree-stage" aria-label="학생들의 행복 사과나무"><div class="sun"></div><div class="cloud one">☁</div><div class="cloud two">☁</div><div class="tree" aria-hidden="true"><div class="foliage crown-a"></div><div class="foliage crown-b"></div><div class="foliage crown-c"></div><div class="foliage crown-d"></div><div class="branches"></div><div class="trunk"></div></div><div class="flowers-layer" id="flowersLayer"></div><div class="empty-hint" id="emptyHint"><strong>나무에 첫 꽃을 피워볼까요?</strong>엑셀 파일에서 학생 이름을 불러오면<br>이곳에 사과꽃이 피어요 🌱</div></section>
    <footer class="tree-footer"><label class="upload-button" for="excelFile">📄 엑셀에서 학생 불러오기</label><input class="file-input" id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button class="upload-button" id="addStudentButton" type="button">＋ 학생 직접 추가</button><button class="upload-button" id="demoButton" type="button">🌷 예시 학생 보기</button></footer>
    <p class="note">사과꽃을 눌러 학생에게 전할 행복한 말을 적어주세요. 데이터는 이 기기에 자동 저장됩니다.</p>
  </main>
  <div class="modal-backdrop" id="messageModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle">꽃에게 행복한 말을 선물해요</h2><p class="sub" id="modalStudent"></p><label for="studentName">학생 이름</label><input id="studentName" maxlength="30" placeholder="학생 이름"><label for="kindMessage">행복을 주는 말</label><input id="kindMessage" maxlength="120" placeholder="예: 너의 미소는 주변을 환하게 밝혀줘!"><div class="modal-buttons"><button class="cancel" id="cancelModal" type="button">취소</button><button class="save" id="saveMessage" type="button">🌸 사과꽃 피우기</button></div></div></div>
  <div class="result-backdrop" id="resultModal" role="dialog" aria-modal="true" aria-label="오늘의 행복 사과"><div class="result-card"><div class="result-apple">🍎</div><div class="eyebrow">오늘 당신에게 도착한 행복</div><h2 id="resultName"></h2><p class="message" id="resultMessage"></p><button class="close-result" id="closeResult" type="button">행복을 간직할게요 💚</button></div></div>
  <div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const STORAGE_KEY = 'happy-apple-tree-v1';
  const layout = [[18,32],[31,22],[45,16],[59,21],[74,31],[24,43],[39,37],[54,40],[68,44],[31,57],[47,53],[62,58],[17,52],[78,52],[40,68],[57,68],[26,68],[72,68],[50,29],[12,39],[84,40],[35,47],[64,29],[48,61],[21,60],[76,60],[43,28],[58,50],[30,31],[70,38],[50,74],[16,70],[83,69],[37,58],[65,75],[52,44]];
  let students = load(); let editingId = null; let toastTimer;
  const $ = id => document.getElementById(id);
  function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(saved)?saved:[]}catch{return []}}
  function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(students))}
  function safeText(value){return String(value??'').trim()}
  function render(){
    const layer=$('flowersLayer'); layer.innerHTML='';
    students.forEach((student,index)=>{
      const button=document.createElement('button'); button.type='button'; button.className='flower '+(student.message?'apple':'');
      const pos=layout[index%layout.length]; const ring=Math.floor(index/layout.length); button.style.left=`${Math.max(7,Math.min(93,pos[0]+(ring%2?3:-3)))}%`; button.style.top=`${Math.max(13,Math.min(82,pos[1]+(ring?ring*2:0)))}%`;
      button.setAttribute('aria-label',`${student.name}${student.message?' 사과':' 사과꽃'}: 눌러서 ${student.message?'수정':'행복한 말 입력'}`);
      const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=student.message?'🍎':'🌸';button.append(emoji);
      const name=document.createElement('span');name.className='name';name.textContent=student.name;button.append(name);
      button.addEventListener('click',()=>openEditor(student.id));layer.append(button);
    });
    const flowers=students.filter(s=>!s.message).length, apples=students.filter(s=>s.message).length;
    $('flowerCount').textContent=flowers;$('appleCount').textContent=apples;$('pickedCount').textContent=students.filter(s=>s.picked).length;
    $('drawButton').disabled=apples===0;$('emptyHint').style.display=students.length?'none':'block';
  }
  function notify(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
  function openEditor(id=null){editingId=id;const student=students.find(s=>s.id===id);$('modalTitle').textContent=student?.message?'행복한 말을 수정해요':'꽃에게 행복한 말을 선물해요';$('modalStudent').textContent=student?'사과꽃을 눌러 언제든 이름과 말을 수정할 수 있어요.':'새로운 학생의 사과꽃을 만들어요.';$('studentName').value=student?.name||'';$('kindMessage').value=student?.message||'';$('messageModal').classList.add('open');setTimeout(()=>(student?.message?$('kindMessage'):$('studentName')).focus(),30)}
  function closeEditor(){$('messageModal').classList.remove('open');editingId=null}
  $('saveMessage').addEventListener('click',()=>{const name=safeText($('studentName').value),message=safeText($('kindMessage').value);if(!name){notify('학생 이름을 입력해주세요.');$('studentName').focus();return}if(!message){notify('행복을 주는 말을 적어주세요.');$('kindMessage').focus();return}if(editingId){const s=students.find(x=>x.id===editingId);if(s){s.name=name;s.message=message;s.picked=false}}else students.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,name,message,picked:false});persist();render();closeEditor();notify('행복한 말이 사과로 열렸어요 🍎')});
  $('cancelModal').addEventListener('click',closeEditor);$('messageModal').addEventListener('click',e=>{if(e.target===$('messageModal'))closeEditor()});$('addStudentButton').addEventListener('click',()=>openEditor());
  $('excelFile').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{if(!window.XLSX)throw new Error('엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');const data=await file.arrayBuffer();const workbook=XLSX.read(data,{type:'array'});const rows=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{header:1,defval:''});let names=rows.flat().map(safeText).filter(Boolean);if(names.length&&/^(이름|학생\s*이름|성명|name|student)$/i.test(names[0]))names.shift();const existing=new Set(students.map(s=>s.name));const unique=[...new Set(names)].filter(name=>!existing.has(name));unique.forEach(name=>students.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,name,message:'',picked:false}));persist();render();notify(unique.length?`${unique.length}명의 학생 이름을 불러왔어요 🌸`:'새로 추가할 학생 이름이 없어요.');}catch(error){notify(error.message||'파일을 읽지 못했어요.')}finally{event.target.value=''}});
  $('demoButton').addEventListener('click',()=>{const sample=['햇살','다온','별이','하늘','봄이','윤슬'];const existing=new Set(students.map(s=>s.name));sample.filter(n=>!existing.has(n)).forEach(name=>students.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,name,message:'너의 따뜻한 마음은 모두에게 큰 행복이야!',picked:false}));persist();render();notify('예시 사과를 나무에 열었어요 🍎')});
  $('drawButton').addEventListener('click',()=>{const available=students.filter(s=>s.message&&!s.picked);if(!available.length){notify('먼저 사과꽃에 행복한 말을 적어주세요.');return}const chosen=available[Math.floor(Math.random()*available.length)];chosen.picked=true;const element=[...$('flowersLayer').children].find(el=>el.getAttribute('aria-label').startsWith(chosen.name+' 사과'));if(element){element.style.animation='fall .75s ease-in forwards';element.style.pointerEvents='none'}persist();setTimeout(()=>{render();$('resultName').textContent=chosen.name+'에게';$('resultMessage').textContent=chosen.message;$('resultModal').classList.add('open')},650)});
  function closeResult(){$('resultModal').classList.remove('open')} $('closeResult').addEventListener('click',closeResult);$('resultModal').addEventListener('click',e=>{if(e.target===$('resultModal'))closeResult()});
  $('resetButton').addEventListener('click',()=>{if(!students.length){notify('초기화할 내용이 없어요.');return}if(confirm('오늘의 사과나무를 처음 상태로 되돌릴까요? 학생과 행복한 말이 모두 지워집니다.')){students=[];persist();render();notify('나무를 새롭게 비웠어요 🌱')}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEditor();closeResult()}if(e.key==='Enter'&&$('messageModal').classList.contains('open'))$('saveMessage').click()});
  render();
})();
</script>
</body>
</html>
