<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6d8">
  <title>오늘의 행복 사과나무 🍎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--ink:#574236;--green:#4c8b55;--pink:#ff8ca1;--yellow:#ffcf56;--sky:#c9efff;--shadow:0 10px 0 #89633b18,0 16px 30px #4e57341b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff8df,#fff1ed 54%,#e6f8e6);color:var(--ink);font-family:'Jua',sans-serif;letter-spacing:.2px}button,input{font:inherit}button{cursor:pointer}.page{max-width:1220px;margin:auto;padding:20px 24px 32px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;display:flex;align-items:center;gap:8px}.brand-icon{font-size:32px}.soft-button,.upload-button,.draw-button{border:0;border-radius:20px;padding:11px 16px;background:#fff;color:#5d794d;box-shadow:0 5px 0 #668d4d25;transition:.18s}.soft-button:hover,.upload-button:hover{transform:translateY(-2px)}.intro{text-align:center;padding:24px 0 15px}.eyebrow{display:inline-block;padding:7px 13px;border-radius:99px;background:#fff;border:2px solid #ffe39b;color:#b27643;font-size:14px}.intro h1{font-size:clamp(30px,5vw,47px);color:#52884d;text-shadow:2px 3px #fff;margin:11px 0 4px}.intro p{font-size:17px;color:#846a55;margin:0}.dashboard{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin:17px 0 15px}.stat{padding:9px 14px;background:#fff;border-radius:18px;border:2px solid #f6e7c7;color:#8b7159}.stat strong{font-size:20px;color:#56844f;margin-left:4px}.draw-button{background:#ff776e;color:white;font-size:19px;padding:13px 23px;box-shadow:0 5px 0 #c95c4e}.draw-button:hover{transform:translateY(-2px)}.draw-button:disabled{opacity:.5;cursor:not-allowed;transform:none}
    /* 큰 배경과 클래식한 둥근 수관으로 나무를 키우고, 줄기는 잎보다 가늘게 표현해요. */
    .tree-stage{position:relative;min-height:690px;overflow:hidden;border:4px solid white;border-radius:34px;background:linear-gradient(#c9efff 0 44%,#e4f7cf 44% 88%,#c9e6aa 88%);box-shadow:var(--shadow)}.sun{position:absolute;top:24px;right:9%;width:79px;height:79px;border-radius:50%;background:#ffdc68;box-shadow:0 0 0 12px #fff3b655}.cloud{position:absolute;color:#fff;font-size:48px;text-shadow:0 3px #acd9e5}.cloud.one{top:57px;left:8%}.cloud.two{top:120px;right:11%;font-size:37px}.ground{position:absolute;inset:auto 0 0;height:85px;background:#b9df88;border-radius:50% 50% 0 0/24% 24% 0 0}
    /* 이전 나무처럼 포개진 둥근 잎사귀와 가지를 사용하고, 잎 왕관은 넓고 풍성하게 배치합니다. */
    .tree{position:absolute;width:min(760px,88%);height:620px;left:50%;bottom:16px;transform:translateX(-50%);z-index:1}.trunk{position:absolute;left:50%;bottom:0;width:88px;height:230px;transform:translateX(-50%);background:linear-gradient(90deg,#805c3c,#a77b51 48%,#805c3c);border-radius:44% 44% 9px 9px;clip-path:polygon(24% 100%,30% 37%,4% 12%,12% 5%,39% 25%,46% 0,58% 0,62% 25%,90% 5%,98% 13%,67% 43%,78% 100%)}.foliage{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#abc68c,#759b69 72%);box-shadow:inset -12px -13px 0 #668d602c}.crown-a{width:58%;height:330px;left:21%;top:20px}.crown-b{width:47%;height:290px;left:2%;top:115px}.crown-c{width:47%;height:290px;right:2%;top:115px}.crown-d{width:52%;height:280px;left:24%;top:235px}.branches{position:absolute;left:50%;top:240px;width:55%;height:170px;transform:translateX(-50%);border-top:9px solid #815d3d;border-radius:50%;opacity:.9}.branches:before,.branches:after{content:'';position:absolute;top:-35px;width:8px;height:95px;background:#815d3d;transform:rotate(-42deg);left:20%;border-radius:8px}.branches:after{left:auto;right:20%;transform:rotate(42deg)}
    .flowers-layer{position:absolute;inset:0;z-index:3;pointer-events:none}.flower{position:absolute;width:72px;height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:transparent;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 1px #46552b38);pointer-events:auto;transition:transform .18s}.flower:hover{transform:translate(-50%,-50%) scale(1.16);z-index:5}.flower .emoji{font-size:42px;line-height:45px}.flower.apple .emoji{font-size:39px}.flower .name{max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 7px;border-radius:99px;background:#fff;color:#62503d;font-size:12px;border:1px solid #f4d7a1}.empty-hint{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,80%);padding:19px;border:3px dashed #92bc75;border-radius:24px;background:#fff;text-align:center;color:#648454;line-height:1.6}.empty-hint strong{display:block;color:#52884d;font-size:20px;margin-bottom:4px}.tree-footer{position:relative;z-index:4;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:16px}.upload-button{display:inline-block;font-size:15px}.note{text-align:center;color:#8a7966;font-size:13px;margin:8px 0}.file-input{display:none}
    .modal-backdrop,.result-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:20;background:#433c367c;backdrop-filter:blur(4px)}.modal-backdrop.open,.result-backdrop.open{display:flex}.modal{width:min(440px,100%);padding:27px;border:4px solid #ffe29a;border-radius:28px;background:#fffdf3;box-shadow:var(--shadow)}.modal h2{font-size:25px;margin:0 0 7px;color:#58894d}.modal .sub{color:#8a7966;margin:0 0 16px}.modal label{display:block;margin:12px 0 6px;color:#806950}.modal input{width:100%;padding:12px;border:2px solid #eee0c8;border-radius:14px;outline:none}.modal input:focus{border-color:#9ec77b}.modal-buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.modal-buttons button,.close-result{border:0;border-radius:14px;padding:11px 16px}.cancel{background:#f1ece2;color:#786b5c}.save,.close-result{background:#69a85b;color:white}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:12px 18px;border-radius:99px;background:#574236;color:white;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.result-backdrop{z-index:25;background:#37643dc9}.result-card{width:min(500px,100%);min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 26px;border:6px solid #ffe49a;border-radius:38px;background:#fffdf1;box-shadow:0 20px 0 #cfaa5c55,0 30px 80px #172a2066}.result-apple{font-size:90px;animation:bob 1.5s ease-in-out infinite}.result-card h2{font-size:32px;color:#57864d;margin:8px}.result-card .message{font-size:23px;line-height:1.5;color:#866440;margin:5px 0 22px;max-width:390px;overflow-wrap:anywhere}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translate(-50%,180px) rotate(35deg);opacity:0}}
    /* 휴대폰에서도 나무 전체가 넉넉히 보이도록 잎과 줄기 비율을 맞춥니다. */
    @media(max-width:650px){.page{padding:15px 11px 24px}.brand{font-size:18px}.brand-icon{font-size:27px}.soft-button{padding:9px 10px;font-size:12px}.intro{padding-top:22px}.intro p{font-size:14px}.tree-stage{min-height:570px;border-radius:25px}.tree{width:100%;height:530px;bottom:12px}.trunk{height:195px;width:72px}.crown-a{width:66%;height:285px;left:17%;top:18px}.crown-b{width:53%;height:245px;left:-1%;top:105px}.crown-c{width:53%;height:245px;right:-1%;top:105px}.crown-d{width:58%;height:230px;left:21%;top:210px}.branches{top:205px}.flower{width:58px;height:68px}.flower .emoji{font-size:35px;line-height:37px}.flower.apple .emoji{font-size:33px}.flower .name{max-width:70px;font-size:11px}.sun{width:58px;height:58px;top:18px}.cloud.one{font-size:35px}.cloud.two{font-size:29px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div class="brand"><span class="brand-icon">🌳</span> 오늘의 행복 사과나무</div><button class="soft-button" id="resetButton" type="button">🔄 나무 처음으로</button></header>
    <section class="intro"><span class="eyebrow">🌼 다정한 말은 행복의 씨앗!</span><h1>오늘의 행복을 키워요 🍎</h1><p>꽃에게 예쁜 말을 선물하고, 오늘의 사과를 뽑아봐요!</p></section>
    <section class="dashboard" aria-label="나무 현황"><div class="stat">🌸 꽃 <strong id="flowerCount">0</strong></div><div class="stat">🍎 사과 <strong id="appleCount">0</strong></div><div class="stat">🎉 뽑은 사과 <strong id="pickedCount">0</strong></div><button class="draw-button" id="drawButton" type="button" disabled>🍎 사과 뽑기!</button></section>
    <section class="tree-stage" aria-label="학생들의 행복 사과나무"><div class="sun"></div><div class="cloud one">☁️</div><div class="cloud two">☁️</div><div class="ground"></div><div class="tree" aria-hidden="true"><div class="foliage crown-a"></div><div class="foliage crown-b"></div><div class="foliage crown-c"></div><div class="foliage crown-d"></div><div class="branches"></div><div class="trunk"></div></div><div class="flowers-layer" id="flowersLayer"></div><div class="empty-hint" id="emptyHint"><strong>나무에 꽃을 피워볼까요? 🌱</strong>엑셀에서 학생 이름을 불러오면<br>예쁜 꽃이 활짝 피어요!</div></section>
    <footer class="tree-footer"><label class="upload-button" for="excelFile">📄 엑셀에서 학생 불러오기</label><input class="file-input" id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button class="upload-button" id="addStudentButton" type="button">➕ 학생 직접 추가</button><button class="upload-button" id="demoButton" type="button">🌷 예시 꽃 피우기</button></footer>
    <p class="note">🌟 꽃을 눌러 행복한 말을 적어주세요. 이 기기에 자동 저장돼요!</p>
  </main>
  <div class="modal-backdrop" id="messageModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle">꽃에게 예쁜 말을 선물해요 🌷</h2><p class="sub" id="modalStudent"></p><label for="studentName">학생 이름</label><input id="studentName" maxlength="30" placeholder="이름을 적어주세요"><label for="kindMessage">행복을 주는 말</label><input id="kindMessage" maxlength="120" placeholder="예: 너의 웃음은 햇살처럼 따뜻해!"><div class="modal-buttons"><button class="cancel" id="cancelModal" type="button">다음에 할래요</button><button class="save" id="saveMessage" type="button">🌸 사과로 키우기!</button></div></div></div>
  <div class="result-backdrop" id="resultModal" role="dialog" aria-modal="true" aria-label="오늘의 행복 사과"><div class="result-card"><div class="result-apple">🍎</div><span class="eyebrow">오늘 도착한 행복 편지 💌</span><h2 id="resultName"></h2><p class="message" id="resultMessage"></p><button class="close-result" id="closeResult" type="button">행복을 간직할게요 💚</button></div></div>
  <div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const STORAGE_KEY='happy-apple-tree-v1';
  // 학생 수가 많아도 나무 잎사귀 안쪽에 꽃과 사과가 놓이도록 좌표를 반복 사용해요.
  const layout=[[50,19],[38,23],[62,23],[27,29],[73,29],[45,30],[56,32],[17,37],[34,39],[49,40],[66,39],[83,37],[25,49],[40,50],[56,50],[72,49],[32,61],[48,61],[65,61],[51,72],[22,43],[78,43],[42,34],[59,42],[35,55],[61,56],[50,25],[28,34],[72,34],[46,46],[55,58],[38,68],[64,68],[18,56],[82,56],[50,54]];
  let students=load(),editingId=null,toastTimer;
  const $=id=>document.getElementById(id);
  // 브라우저에 저장된 학생 자료를 불러오고, 바뀐 내용은 다시 저장해요.
  function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(saved)?saved:[]}catch{return []}}
  function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(students))}
  function safeText(value){return String(value??'').trim()}
  // 나무 위에 학생별 꽃·사과를 그리고 개수를 새로 표시해요.
  function render(){
    const layer=$('flowersLayer');layer.innerHTML='';
    students.forEach((student,index)=>{
      const button=document.createElement('button');button.type='button';button.className='flower '+(student.message?'apple':'');
      const pos=layout[index%layout.length],ring=Math.floor(index/layout.length);
      button.style.left=`${Math.max(14,Math.min(86,pos[0]+(ring%2?2:-2)))}%`;
      button.style.top=`${Math.max(19,Math.min(73,pos[1]+(ring?ring*1.5:0)))}%`;
      button.setAttribute('aria-label',`${student.name}${student.message?' 사과':' 사과꽃'}: 눌러서 ${student.message?'수정':'행복한 말 입력'}`);
      const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=student.message?'🍎':'🌸';button.append(emoji);
      const name=document.createElement('span');name.className='name';name.textContent=student.name;button.append(name);
      button.addEventListener('click',()=>openEditor(student.id));layer.append(button);
    });
    const flowers=students.filter(s=>!s.message).length,apples=students.filter(s=>s.message&&!s.picked).length;
    $('flowerCount').textContent=flowers;$('appleCount').textContent=apples;$('pickedCount').textContent=students.filter(s=>s.picked).length;
    $('drawButton').disabled=apples===0;$('emptyHint').style.display=students.length?'none':'block';
  }
  // 화면 아래에 잠시 나타나는 안내말이에요.
  function notify(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
  function openEditor(id=null){editingId=id;const student=students.find(s=>s.id===id);$('modalTitle').textContent=student?.message?'행복한 말을 고쳐요 ✏️':'꽃에게 예쁜 말을 선물해요 🌷';$('modalStudent').textContent=student?'이름이나 행복한 말을 바꿀 수 있어요!':'새로운 친구의 꽃을 만들어요.';$('studentName').value=student?.name||'';$('kindMessage').value=student?.message||'';$('messageModal').classList.add('open');setTimeout(()=>(student?.message?$('kindMessage'):$('studentName')).focus(),30)}
  function closeEditor(){$('messageModal').classList.remove('open');editingId=null}
  // 입력한 이름과 다정한 말을 저장해 사과로 바꿔요.
  $('saveMessage').addEventListener('click',()=>{const name=safeText($('studentName').value),message=safeText($('kindMessage').value);if(!name){notify('학생 이름을 적어주세요!');$('studentName').focus();return}if(!message){notify('행복한 말을 적어주세요!');$('kindMessage').focus();return}if(editingId){const s=students.find(x=>x.id===editingId);if(s){s.name=name;s.message=message;s.picked=false}}else students.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,name,message,picked:false});persist();render();closeEditor();notify('예쁜 사과가 열렸어요! 🍎')});
  $('cancelModal').addEventListener('click',closeEditor);$('messageModal').addEventListener('click',e=>{if(e.target===$('messageModal'))closeEditor()});$('addStudentButton').addEventListener('click',()=>openEditor());
  // 엑셀 첫 번째 시트에서 학생 이름을 읽어 나무에 꽃으로 추가해요.
  $('excelFile').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{if(!window.XLSX)throw new Error('엑셀 도구를 불러오지 못했어요. 인터넷을 확인해주세요!');const data=await file.arrayBuffer(),workbook=XLSX.read(data,{type:'array'}),rows=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{header:1,defval:''});let names=rows.flat().map(safeText).filter(Boolean);if(names.length&&/^(이름|학생\s*이름|성명|name|student)$/i.test(names[0]))names.shift();const existing=new Set(students.map(s=>s.name)),unique=[...new Set(names)].filter(name=>!existing.has(name));unique.forEach(name=>students.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,name,message:'',picked:false}));persist();render();notify(unique.length?`${unique.length}명의 꽃이 피었어요! 🌸`:'새로 추가할 이름이 없어요.')}catch(error){notify(error.message||'파일을 읽지 못했어요.')}finally{event.target.value=''}});
  // 사용 방법을 둘러볼 수 있게 예시 학생과 행복한 말을 넣어요.
  $('demoButton').addEventListener('click',()=>{const sample=['햇살','다온','별이','하늘','봄이','윤슬'],existing=new Set(students.map(s=>s.name));sample.filter(n=>!existing.has(n)).forEach(name=>students.push({id:crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,name,message:'너의 따뜻한 마음은 모두에게 큰 행복이야!',picked:false}));persist();render();notify('예쁜 예시 사과가 열렸어요! 🍎')});
  // 아직 뽑지 않은 사과 중 하나를 골라 떨어뜨리고 행복 메시지를 보여줘요.
  $('drawButton').addEventListener('click',()=>{const available=students.filter(s=>s.message&&!s.picked);if(!available.length){notify('먼저 꽃에 행복한 말을 적어주세요!');return}const chosen=available[Math.floor(Math.random()*available.length)];chosen.picked=true;const element=[...$('flowersLayer').children].find(el=>el.getAttribute('aria-label').startsWith(chosen.name+' 사과'));if(element){element.style.animation='fall .75s ease-in forwards';element.style.pointerEvents='none'}persist();setTimeout(()=>{render();$('resultName').textContent=chosen.name+'에게';$('resultMessage').textContent=chosen.message;$('resultModal').classList.add('open')},650)});
  function closeResult(){$('resultModal').classList.remove('open')}$('closeResult').addEventListener('click',closeResult);$('resultModal').addEventListener('click',e=>{if(e.target===$('resultModal'))closeResult()});
  // 확인한 경우에만 학생과 메시지를 모두 지워 나무를 초기화해요.
  $('resetButton').addEventListener('click',()=>{if(!students.length){notify('나무가 벌써 새로워요!');return}if(confirm('학생과 행복한 말을 모두 지우고 나무를 처음으로 되돌릴까요?')){students=[];persist();render();notify('새로운 나무가 되었어요! 🌱')}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEditor();closeResult()}if(e.key==='Enter'&&$('messageModal').classList.contains('open'))$('saveMessage').click()});
  render();
})();
</script>
</body>
</html>
